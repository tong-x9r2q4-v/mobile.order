<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>紙コップ モバイルオーダー</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white">

  <!-- 1. 注文画面（通常画面） -->
  <main id="customer-view" class="w-full max-w-md mx-auto p-5 flex-1 flex flex-col justify-between">
    <div class="space-y-6 pt-4">
      <!-- ヘッダー -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white text-3xl shadow-lg shadow-indigo-200">
          🥤
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">紙コップ オーダー</h1>
        <p class="text-xs text-slate-500">お名前を入力してボタンを押すだけで完了します</p>
      </div>

      <!-- 注文カード -->
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 space-y-5">
        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">お名前</label>
          <input type="text" id="username" placeholder="例: 山田 太郎"
            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-slate-900 font-medium placeholder-slate-400 text-sm">
        </div>

        <!-- 商品情報 -->
        <div class="p-4 bg-indigo-50/50 rounded-2xl border border-indigo-100/60 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-xl shadow-sm border border-slate-100">
              🥛
            </div>
            <div>
              <div class="font-bold text-slate-800 text-sm">紙コップ</div>
              <div class="text-xs text-slate-500">数量: 1個</div>
            </div>
          </div>
          <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700">
            FREE
          </span>
        </div>

        <!-- 送信ボタン -->
        <button onclick="sendOrder()"
          class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition duration-150 ease-in-out flex items-center justify-center space-x-2 text-base">
          <span>注文を送信する</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </div>

      <!-- ステータス通知 -->
      <div id="status-container" class="hidden">
        <div id="status" class="p-4 rounded-2xl text-center text-sm font-semibold transition-all shadow-sm"></div>
      </div>
    </div>

    <!-- 隠しトリガーフッター -->
    <footer class="mt-8 text-center py-4">
      <span onclick="handleSecretTap()" class="text-xs text-slate-400 cursor-pointer select-none hover:text-slate-600 transition">
        © 2026 Water Store
      </span>
    </footer>
  </main>

  <!-- 2. 店舗受信用画面（隠し画面） -->
  <main id="store-view" class="hidden w-full max-w-lg mx-auto p-5 min-h-screen flex flex-col">
    <!-- ヘッダー -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-lg">
          🏪
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-sm">店舗受信用端末</h1>
          <div class="flex items-center space-x-1.5 text-xs mt-0.5">
            <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            <span id="store-status" class="text-slate-500 font-medium">接続中...</span>
          </div>
        </div>
      </div>
      <button onclick="location.reload()" class="px-3 py-1.5 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
        画面を閉じる
      </button>
    </div>

    <!-- 注文一覧 -->
    <div class="flex-1 bg-white p-5 rounded-3xl shadow-sm border border-slate-200 flex flex-col">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
        <h2 class="font-bold text-slate-800 text-xs uppercase tracking-wider">受信した注文</h2>
        <span id="order-count" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-600">0 件</span>
      </div>

      <div class="flex-1 overflow-y-auto">
        <ul id="orders" class="space-y-3"></ul>
        <!-- 空の状態 -->
        <div id="empty-state" class="text-center py-16 text-slate-400">
          <div class="text-4xl mb-2">📥</div>
          <p class="text-xs font-medium">新しい注文を待機しています</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const STORE_PIN = "1234";
    let tapCount = 0;
    let tapTimer = null;
    let count = 0;

    // --- 隠しコマンド判定（3回タップ） ---
    function handleSecretTap() {
      tapCount++;
      clearTimeout(tapTimer);

      if (tapCount >= 3) {
        tapCount = 0;
        const inputPin = prompt("店舗用暗証番号を入力してください:");
        if (inputPin === STORE_PIN) {
          openStoreView();
        } else if (inputPin !== null) {
          alert("暗証番号が違います。");
        }
      } else {
        tapTimer = setTimeout(() => { tapCount = 0; }, 1000);
      }
    }

    // --- 店舗画面の起動 ---
    function openStoreView() {
      document.getElementById('customer-view').classList.add('hidden');
      document.getElementById('store-view').classList.remove('hidden');

      const peer = new Peer('paper-cup-store-secret');

      peer.on('open', () => {
        document.getElementById('store-status').innerText = "注文受付中";
        const dot = document.getElementById('status-dot');
        dot.classList.remove('bg-amber-400', 'animate-pulse');
        dot.classList.add('bg-emerald-500');
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          document.getElementById('empty-state').classList.add('hidden');
          const list = document.getElementById('orders');
          const item = document.createElement('li');
          const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          
          count++;
          document.getElementById('order-count').innerText = `${count} 件`;

          item.className = "p-4 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-between shadow-sm animate-fade-in";
          item.innerHTML = `
            <div class="space-y-1">
              <div class="flex items-center space-x-2">
                <span class="font-bold text-slate-900 text-base">${data.name} 様</span>
              </div>
              <div class="text-xs font-medium text-slate-500">${data.item} × ${data.quantity}個</div>
            </div>
            <span class="text-xs font-mono font-medium text-slate-400 bg-white px-2.5 py-1 rounded-lg border border-slate-100">${time}</span>
          `;
          list.prepend(item);
        });
      });
    }

    // --- 注文送信処理 ---
    const customerPeer = new Peer();

    function sendOrder() {
      const nameInput = document.getElementById('username').value.trim();
      const statusContainer = document.getElementById('status-container');
      const status = document.getElementById('status');

      if (!nameInput) {
        showStatus("お名前を入力してください", "bg-amber-50", "text-amber-700", "border-amber-200");
        return;
      }

      showStatus("店舗端末へ送信中...", "bg-slate-100", "text-slate-600", "border-slate-200");

      const conn = customerPeer.connect('paper-cup-store-secret');

      conn.on('open', () => {
        conn.send({
          name: nameInput,
          item: "紙コップ",
          quantity: 1
        });
        showStatus("✅ 注文を送信しました！", "bg-emerald-50", "text-emerald-700", "border-emerald-200");
      });

      conn.on('error', () => {
        showStatus("❌ 送信失敗：店舗受信用端末が開いていません", "bg-rose-50", "text-rose-700", "border-rose-200");
      });
    }

    function showStatus(text, bgColor, textColor, borderColor) {
      const container = document.getElementById('status-container');
      const status = document.getElementById('status');
      container.classList.remove('hidden');
      status.className = `p-4 rounded-2xl text-center text-sm font-semibold border ${bgColor} ${textColor} ${borderColor}`;
      status.innerText = text;
    }
  </script>
</body>
</html>
