<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコードリーダー</title>
    <!-- html5-qrcodeライブラリの読み込み -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background: #f4f4f9;
        }
        h1 {
            font-size: 1.2rem;
            color: #333;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #result-container {
            margin-top: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #result {
            word-break: break-all;
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>カメラでQRコードを読み取る</h1>
    
    <!-- カメラ映像が表示されるエリア -->
    <div id="reader"></div>

    <!-- 読み取り結果が表示されるエリア -->
    <div id="result-container">
        <p>読み取り結果:</p>
        <div id="result">ここに結果が表示されます</div>
    </div>

    <script>
        // QRコード読み取り成功時の処理
        function onScanSuccess(decodedText, decodedResult) {
            // 画面に読み取ったテキストを表示
            document.getElementById('result').innerText = decodedText;
            
            // 例: URLの場合はリンクにするなどの処理も可能
            if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                document.getElementById('result').innerHTML = `<a href="${decodedText}" target="_blank">${decodedText}</a>`;
            }
        }

        // カメラエラーや読み取り中の非ヒット時の処理（省略・コンソール出力のみ）
        function onScanFailure(error) {
            // 読み取り中は毎フレーム呼ばれるため何もしなくてOKです
        }

        // スキャナーの初期化と起動
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: { width: 250, height: 250 } }, 
            false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>

</body>
</html>
