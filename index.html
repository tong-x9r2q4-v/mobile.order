<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>紙コップ モバイルオーダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between antialiased">

  <!-- 1. 注文画面（お客様用） -->
  <main id="customer-view" class="w-full max-w-md mx-auto p-5 flex-1 flex flex-col justify-between">
    <div class="space-y-5 pt-2">
      <!-- ヘッダー -->
      <div class="text-center space-y-1">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white text-2xl shadow-lg shadow-indigo-200">
          🥤
        </div>
        <h1 class="text-xl font-bold tracking-tight text-slate-900">モバイルオーダー</h1>
      </div>

      <!-- 一時停止アラート -->
      <div id="pause-alert" class="hidden p-4 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 text-center text-xs font-bold">
        ⚠️ ただいま一時的に注文の受付を停止しております
      </div>

      <!-- 注文フォーム（常に表示） -->
      <div id="order-form-card" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-4">
        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">お名前</label>
          <input type="text" id="username" placeholder="例: 山田 太郎"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-slate-900 font-medium placeholder-slate-400 text-sm">
        </div>

        <!-- マイボトル選択（Eco機能） -->
        <div class="p-3.5 bg-emerald-50/60 rounded-2xl border border-emerald-200/80 flex flex-col space-y-2 cursor-pointer" onclick="toggleEco()">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
              <span class="text-2xl">🌱</span>
              <div>
                <div class="font-bold text-emerald-900 text-xs">マイボトル持参（Eco利用）</div>
                <div class="text-[10px] text-emerald-700">紙コップを使用せず持参容器を使います</div>
              </div>
            </div>
            <input type="checkbox" id="eco-checkbox" class="w-5 h-5 accent-emerald-600 rounded cursor-pointer" onclick="event.stopPropagation()">
          </div>
          <div class="text-[11px] font-bold text-amber-700 bg-amber-100/80 px-2.5 py-1 rounded-lg text-center">
            ⚠️ 持参容器は窓口まで持ってお越しください
          </div>
        </div>

        <button id="submit-btn" onclick="sendOrder()"
          class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition text-sm flex items-center justify-center space-x-2">
          <span>注文を送信する</span>
        </button>
      </div>
    </div>

    <!-- 隠しトリガー -->
    <footer class="mt-6 text-center py-2">
      <span onclick="handleSecretTap()" class="text-[10px] text-slate-400 cursor-pointer select-none">
        © 2026 Water Store
      </span>
    </footer>
  </main>

  <!-- 2. 店舗受信用画面（隠し画面） -->
  <main id="store-view" class="hidden w-full max-w-lg mx-auto p-4 min-h-screen flex flex-col space-y-4">
    <!-- ヘッダー＆コントロール -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span id="status-dot" class="w-3 h-3 rounded-full bg-emerald-500"></span>
          <h1 class="font-bold text-slate-900 text-sm">店舗管理端末</h1>
        </div>
        <button onclick="location.reload()" class="px-2.5 py-1 text-xs font-semibold text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-lg">
          閉じる
        </button>
      </div>

      <!-- 集計＆受付停止 -->
      <div class="grid grid-cols-3 gap-2 text-center pt-2 border-t border-slate-100">
        <div class="p-2 bg-slate-50 rounded-xl border border-slate-100">
          <div class="text-[10px] text-slate-400 font-bold">本日提供数</div>
          <div id="total-count" class="text-lg font-extrabold text-slate-800">0</div>
        </div>
        <div class="p-2 bg-emerald-50 rounded-xl border border-emerald-100">
          <div class="text-[10px] text-emerald-600 font-bold">Eco貢献数</div>
          <div id="eco-count" class="text-lg font-extrabold text-emerald-700">0</div>
        </div>
        <button id="pause-toggle-btn" onclick="toggleStorePause()" class="p-2 bg-slate-100 hover:bg-amber-100 text-slate-700 hover:text-amber-800 rounded-xl font-bold text-xs flex flex-col justify-center items-center border border-slate-200">
          <span>受付状態</span>
          <span id="pause-btn-label" class="text-[10px] font-normal text-emerald-600">🟢 受付中</span>
        </button>
      </div>
    </div>

    <!-- 注文リスト -->
    <div class="flex-1 bg-white p-4 rounded-3xl shadow-sm border border-slate-200 flex flex-col">
      <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
        <h2 class="font-bold text-slate-800 text-xs uppercase">受信リスト</h2>
        <span id="pending-count" class="px-2 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-600">0 件</span>
      </div>

      <div class="flex-1 overflow-y-auto">
        <ul id="orders-list" class="space-y-2.5"></ul>
        <div id="empty-state" class="text-center py-12 text-slate-400">
          <div class="text-3xl mb-1">📥</div>
          <p class="text-xs">注文を待機中</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const STORE_PIN = "1234";
    let tapCount = 0, tapTimer = null;
    let storePeer = null, customerPeer = null, currentConn = null;
    
    let orders = JSON.parse(localStorage.getItem('store_orders') || '[]');
    let totalServed = parseInt(localStorage.getItem('store_total') || '0');
    let ecoServed = parseInt(localStorage.getItem('store_eco') || '0');
    let isPaused = localStorage.getItem('store_paused') === 'true';
    let nextOrderNum = parseInt(localStorage.getItem('store_next_num') || '1');

    function toggleEco() {
      const cb = document.getElementById('eco-checkbox');
      cb.checked = !cb.checked;
    }

    function handleSecretTap() {
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount >= 3) {
        tapCount = 0;
        if (prompt("店舗用暗証番号:") === STORE_PIN) openStoreView();
      } else {
        tapTimer = setTimeout(() => { tapCount = 0; }, 1000);
      }
    }

    // --- 店舗端末の処理 ---
    function openStoreView() {
      document.getElementById('customer-view').classList.add('hidden');
      document.getElementById('store-view').classList.remove('hidden');

      storePeer = new Peer('paper-cup-store-secret');
      updateStoreUI();

      storePeer.on('connection', (conn) => {
        conn.on('data', (data) => {
          if (data.type === 'order') {
            if (isPaused) {
              conn.send({ type: 'rejected', reason: '一時受付停止中' });
              return;
            }
            const numStr = String(nextOrderNum).padStart(3, '0');
            nextOrderNum++;
            localStorage.setItem('store_next_num', nextOrderNum);

            const newOrder = {
              id: data.id,
              num: `#${numStr}`,
              name: data.name,
              isEco: data.isEco,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              status: 'pending'
            };

            orders.unshift(newOrder);
            saveStoreData();
            renderStoreOrders();

            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            conn.send({ type: 'accepted', orderNum: newOrder.num });
          }
        });
      });
    }

    function toggleStorePause() {
      isPaused = !isPaused;
      localStorage.setItem('store_paused', isPaused);
      updateStoreUI();
    }

    function saveStoreData() {
      localStorage.setItem('store_orders', JSON.stringify(orders));
      localStorage.setItem('store_total', totalServed);
      localStorage.setItem('store_eco', ecoServed);
    }

    function updateStoreUI() {
      document.getElementById('total-count').innerText = totalServed;
      document.getElementById('eco-count').innerText = ecoServed;
      const btnLabel = document.getElementById('pause-btn-label');
      if (isPaused) {
        btnLabel.innerText = "🔴 停止中";
        btnLabel.className = "text-[10px] font-normal text-rose-600";
      } else {
        btnLabel.innerText = "🟢 受付中";
        btnLabel.className = "text-[10px] font-normal text-emerald-600";
      }
      renderStoreOrders();
    }

    function renderStoreOrders() {
      const list = document.getElementById('orders-list');
      const empty = document.getElementById('empty-state');
      list.innerHTML = '';

      const pendingOrders = orders.filter(o => o.status !== 'done');
      document.getElementById('pending-count').innerText = `${pendingOrders.length} 件`;

      if (orders.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      orders.forEach(o => {
        const li = document.createElement('li');
        li.className = `p-3 rounded-2xl border flex items-center justify-between ${o.status === 'ready' ? 'bg-amber-50/80 border-amber-300' : 'bg-slate-50 border-slate-200'}`;
        li.innerHTML = `
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-extrabold text-indigo-600 text-sm">${o.num}</span>
              <span class="font-bold text-slate-800 text-sm">${o.name} 様</span>
              ${o.isEco ? '<span class="text-[10px] bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded font-bold">🌱 持参容器</span>' : ''}
            </div>
            <div class="text-[10px] text-slate-400 mt-0.5">${o.time}</div>
          </div>
          <div class="flex space-x-1.5">
            <button onclick="finishOrder('${o.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm">
              渡しました
            </button>
            <button onclick="removeOrder('${o.id}')" class="px-2 py-1.5 bg-slate-200 hover:bg-rose-100 text-slate-500 hover:text-rose-600 font-bold text-xs rounded-xl">
              削除
            </button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    function finishOrder(id) {
      const order = orders.find(o => o.id === id);
      if (order) {
        order.status = 'done';
        totalServed++;
        if (order.isEco) ecoServed++;
        saveStoreData();
        updateStoreUI();
      }
    }

    function removeOrder(id) {
      orders = orders.filter(o => o.id !== id);
      saveStoreData();
      updateStoreUI();
    }

    // --- お客様側の処理（画面切り替えなし） ---
    function sendOrder() {
      const usernameInput = document.getElementById('username');
      const name = usernameInput.value.trim();
      const isEco = document.getElementById('eco-checkbox').checked;

      if (!name) {
        alert("お名前を入力してください");
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "送信中...";

      const orderId = 'ord_' + Date.now();
      customerPeer = new Peer();

      let orderAccepted = false;

      customerPeer.on('open', () => {
        currentConn = customerPeer.connect('paper-cup-store-secret');

        currentConn.on('open', () => {
          currentConn.send({
            type: 'order',
            id: orderId,
            name: name,
            isEco: isEco
          });
        });

        currentConn.on('data', (data) => {
          if (data.type === 'accepted') {
            orderAccepted = true;
            submitBtn.disabled = false;
            submitBtn.innerText = "注文を送信する";
            alert(`✅ 注文を受け付けました！\n受付番号: ${data.orderNum}`);
            
            // フォームのリセット（そのまま次の注文を入力可能）
            usernameInput.value = '';
            document.getElementById('eco-checkbox').checked = false;
          } else if (data.type === 'rejected') {
            orderAccepted = true;
            submitBtn.disabled = false;
            submitBtn.innerText = "注文を送信する";
            alert("⚠️ " + data.reason);
          }
        });

        setTimeout(() => {
          if (!orderAccepted) {
            submitBtn.disabled = false;
            submitBtn.innerText = "注文を送信する";
            alert("❌ 店舗端末からの返答がありませんでした。もう一度お試しいだたくか、窓口でお伝えください。");
          }
        }, 5000);
      });
    }
  </script>
</body>
</html>
